<body data-page="portfolio" data-section="dev">
<main>
  <section class="pf-hero" id="pf">
    <div class="pf-pin">
      <div class="pf-glow"></div>
      <div class="pf-label"><span>Android Apps &amp; Web Developer</span><span>Websites · Dashboards</span></div>
      <h1 class="pf-title" id="pfTitle" aria-label="Portfolio">PORTFOLIO</h1>
      <img class="pf-photo" id="pfPhoto" src="assets/me.webp" alt="MRM">
      <div class="pf-info" id="pfInfo">
        <p class="pf-hi">Hi I am</p>
        <h2 class="pf-name grad-text" id="pfName">MRM</h2>
        <div class="pf-sum"><small>Professional Summary</small><div class="pf-typed"><span id="pfTyped"></span><i class="caret"></i></div></div>
      </div>

    </div>

  <section class="work">
    <div class="container">
      <p class="eyebrow reveal">Selected work</p>
      <h2 class="h2 reveal">Android <span class="grad-text">Apps</span></h2>
      <div class="w-grid" id="grid-app" data-kind="app"></div>
    </div>
  </section>
  <section class="work">
    <div class="container">
      <h2 class="h2 reveal">Modern <span class="grad-text">Websites</span></h2>
      <div class="w-grid wide" id="grid-web" data-kind="web"></div>
    </div>
  </section>

  <section class="pf-cta">
    <div class="container">
      <p class="eyebrow">Like what you see?</p>
      <h2 class="h2">Let's work <span class="grad-text">together</span></h2>
      <div class="btn-row" style="justify-content:center">
        <a class="btn btn-green" href="development.html">Start a project</a>
        <a class="btn btn-primary" href="portfolio-video.html">Video portfolio</a>
      </div>
    </div>
  </section>
</main>
