<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — MRM</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05030b">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MRM">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="login" data-nofooter>
<main class="auth-wrap">
  <i class="auth-orb a"></i><i class="auth-orb b"></i>
  <div class="auth-stage">
    <div class="auth-rail" id="authRail" aria-label="Social links"></div>
    <div class="auth-col">
      <div class="disc-scene">
        <div class="disc" id="disc">
          <div class="face front">
            <div class="face-in">
              <h1>Login</h1>
              <p class="sub">Sign in to download apps and leave reviews.</p>
              <form id="loginForm" autocomplete="on">
                <label for="email">Email</label>
                <input class="field" id="email" name="email" type="email" required autocomplete="username" placeholder="you@example.com">
                <label for="password">Password</label>
                <input class="field" id="password" name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••">
                <button class="btn btn-primary block" type="submit">Sign in</button>
              </form>
            </div>
          </div>
          <div class="face back">
            <div class="face-in">
              <h1 id="backTitle">Sign Up</h1>
              <p class="sub" id="backSub">We will email you a link to confirm your address.</p>
              <form id="signupForm" autocomplete="on">
                <label for="semail">Email</label>
                <input class="field" id="semail" name="email" type="email" required autocomplete="username" placeholder="you@example.com">
                <label for="spassword">Password</label>
                <input class="field" id="spassword" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
                <label for="sconfirm">Confirm password</label>
                <input class="field" id="sconfirm" name="confirm" type="password" required autocomplete="new-password" placeholder="Repeat password">
                <button class="btn btn-primary block" type="submit">Create account</button>
              </form>
              <form id="verifyForm" hidden autocomplete="off">
                <div class="mail-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></div>
                <p class="sub" id="verifyNote" style="text-align:center">Open the email and tap the confirm link.</p>
                <button class="btn btn-primary block" type="submit">I have confirmed, sign in</button>
                <div class="link-row">
                  <button class="linkbtn" type="button" id="resendBtn">Resend link</button>
                  <button class="linkbtn" type="button" id="backBtn">Change email</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <p class="auth-switch" id="authSwitch"></p>
      <div class="msg auth-msg" id="loginMsg" role="alert"></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
