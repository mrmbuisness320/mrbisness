<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Editing Portfolio — MRM</title>
    <meta name="description" content="Short-form and long-form video edits by MRM.">
  <meta name="theme-color" content="#05030b">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MRM">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="portfolio" data-section="video">
<main>
  <section class="pf-hero" id="pf">
    <div class="pf-pin">
      <div class="pf-glow"></div>
      <div class="pf-label"><span>Video Editor</span><span>CapCut Templates</span></div>
      <div class="pf-stage" id="pfStage">
      <h1 class="pf-title" id="pfTitle" aria-label="Portfolio">PORTFOLIO</h1>
      <img class="pf-photo" id="pfPhoto" src="assets/me.webp" alt="MRM">
      </div>
      <div class="pf-info" id="pfInfo">
        <p class="pf-hi">Hi I am</p>
        <h2 class="pf-name grad-text" id="pfName">MRM</h2>
        <div class="pf-sum"><small>Professional Summary</small><div class="pf-typed"><span id="pfTyped"></span><i class="caret"></i></div></div>
      </div>
      <div class="pf-skills" id="pfSkills"></div>
      <div class="pf-exp" id="pfExp" hidden><b id="pfExpNum"></b><span>Years experience</span></div>
    </div>
  </section>

  <section class="pf-works" id="works">
    <div class="container">
      <p class="eyebrow reveal">Selected work</p>
      <h2 class="h2 reveal">Edits that <span class="grad-text">hold attention</span></h2>
      <div class="pf-stats reveal" id="pfStats" hidden></div>
      <div class="pf-filter reveal" id="pfFilter" role="tablist" aria-label="Filter projects" hidden></div>
      <div class="pf-board" id="pfBoard"></div>
    </div>
  </section>

  <section class="pf-cta2">
    <div class="container">
      <div class="cta-card">
        <p class="eyebrow">Have a project in mind?</p>
        <h2 class="h2">Let's make it <span class="grad-text">happen</span></h2>
        <p class="lead" style="margin:0 auto 22px;max-width:520px">Tell me what you need. I usually reply the same day.</p>
        <div class="btn-row" style="justify-content:center">
        <a class="btn btn-green" id="ctaWa" href="video-editing.html" target="_blank" rel="noopener">Order an edit on WhatsApp</a>
        <a class="btn btn-primary" id="ctaMail" href="video-editing.html">Send an email</a>
        <a class="btn btn-blue" href="portfolio-dev.html">App &amp; web portfolio</a>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/portfolio.js"></script>

</html>
